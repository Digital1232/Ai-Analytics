<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | LeadFlow AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="logo">LeadFlow AI</div>
            <ul class="nav-links">
                <li class="nav-item"><a href="dashboard.html" class="nav-link active">Dashboard</a></li>
                <li class="nav-item"><a href="analytics.html" class="nav-link">Analytics</a></li>
                <li class="nav-item"><a href="leads.html" class="nav-link">Lead CRM</a></li>
                <li class="nav-item"><a href="insights.html" class="nav-link">AI Insights</a></li>
                <li class="nav-item"><a href="reports.html" class="nav-link">Reports</a></li>
                <li class="nav-item"><a href="settings.html" class="nav-link">Settings</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header style="margin-bottom: 2.5rem;">
                <h1>Intelligence Overview</h1>
                <p style="color: var(--text-muted);">Real-time marketing & admissions performance.</p>
            </header>

            <div class="stats-grid">
                <div class="glass-card">
                    <div class="ai-glow"></div>
                    <p style="color: var(--text-muted);">Total Ad Spend</p>
                    <h2 class="counter" data-target="14500">$0</h2>
                    <span style="color: #10b981; font-size: 0.8rem;">↑ 12% vs last month</span>
                </div>
                <div class="glass-card">
                    <p style="color: var(--text-muted);">Leads Generated</p>
                    <h2 class="counter" data-target="842">0</h2>
                    <span style="color: #10b981; font-size: 0.8rem;">↑ 8.4% conversion</span>
                </div>
                <div class="glass-card">
                    <p style="color: var(--text-muted);">Cost Per Lead</p>
                    <h2 class="counter" data-target="17.20">$0</h2>
                    <span style="color: #ef4444; font-size: 0.8rem;">↓ 2.1% efficiency</span>
                </div>
            </div>
            
            <!-- More dashboard sections will go here -->
        </main>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
